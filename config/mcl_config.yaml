# ================================================================================================
# MONTE CARLO LOCALIZATION (MCL) CONFIGURATION
# ================================================================================================
# This configuration file sets parameters for the Monte Carlo Localization node and the map server.

particle_filter:
  ros__parameters:
    # === CORE ALGORITHM PARAMETERS ===
    max_particles: 2000                # Maximum number of particles
    max_viz_particles: 100              # Visualization downsampling
    max_range: 10.0                    # Laser max range (m)
    max_pose_range: 10000.0           # Maximum valid pose coordinate range (m)

    # === TF CONTROL ===
    publish_map_odom_tf: true          # Publish map->odom transform
    publish_odom_base_tf: false        # Let odom stack handle this

    # === MOTION MODEL NOISE ===
    motion_dispersion_x: 0.1          # Forward motion noise (m)
    motion_dispersion_y: 0.1          # Lateral motion noise (m)
    motion_dispersion_theta: 0.15      # Rotation noise (rad) # ~3 degrees

    # === ROBOT GEOMETRY ===
    wheelbase: 0.324                   # Distance between axles (m)

    # === SENSOR MODEL ===
    z_hit: 0.87                        # Weight for correct measurements
    z_short: 0.03                      # Weight for short readings
    z_max: 0.05                        # Weight for max range readings
    z_rand: 0.05                       # Weight for random noise
    sigma_hit: 0.5                     # Measurement noise std dev

    # === RAY CASTING ===
    angle_step: 18                     # Laser downsampling factor
    squash_factor: 1.2                 # Weight normalization power
    use_parallel_raycasting: true      # Enable parallel processing
    num_threads: 0                     # Auto-detect threads

    # === ROS INTERFACE ===
    scan_topic: "/scan"                # LaserScan input topic
    odom_topic: "/odom"                # Odometry input topic
    publish_odom: true                 # Publish pose as odometry message
    viz: true                          # Enable particle visualization
    timer_frequency: 30.0              # Timer frequency (Hz) - publishing only now
    update_from: "odom"                # MCL update trigger: "odom", "lidar", or "timer"

    # === TF FRAME NAMES ===
    map_frame: "map"                   # Global reference frame
    odom_frame: "odom"                 # Odometry frame
    base_frame: "base_link"            # Robot base frame
    laser_frame: "laser"               # Laser scanner frame
    

# ================================================================================================
# MAP SERVER CONFIGURATION
# ================================================================================================
map_server:
  ros__parameters:
    # Default map file (override with launch argument: map_name:='your_map')
    map: 'sibal1'                      # Map name without .yaml extension
